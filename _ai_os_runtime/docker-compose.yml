name: ai-os-runtime

services:
  ai_os_postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ai_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AI_OS_POSTGRES_USER:-ai_os}
      POSTGRES_PASSWORD: ${AI_OS_POSTGRES_PASSWORD:-ai_os_local_dev_change_me}
      POSTGRES_DB: ${AI_OS_POSTGRES_DB:-ai_os}
    ports:
      - "127.0.0.1:${AI_OS_POSTGRES_PORT:-54329}:5432"
    volumes:
      - ai_os_postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_OS_POSTGRES_USER:-ai_os} -d ${AI_OS_POSTGRES_DB:-ai_os}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai_os_qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_os_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_OS_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${AI_OS_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ai_os_qdrant_data:/qdrant/storage

  ai_os_redis:
    image: redis:7-alpine
    container_name: ai_os_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${AI_OS_REDIS_PORT:-63799}:6379"
    volumes:
      - ai_os_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ai_os_postgres_data:
    external: true
    name: ai-os-runtime_ai_os_postgres_data
  ai_os_qdrant_data:
    external: true
    name: ai-os-runtime_ai_os_qdrant_data
  ai_os_redis_data:
    external: true
    name: ai-os-runtime_ai_os_redis_data
