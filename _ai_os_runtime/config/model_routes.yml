  software_engineering:
    task_class: coding
    default_provider: codex
    default_model: current_codex
    max_cost_tier: codex

budget:
  currency: INR
  monthly_soft_cap: 3000
  monthly_hard_cap: 4000
  daily_hard_cap: 150
  heavy_route_reserve_pct: 20
  hard_stop_on_breach: true
  expected_operating_band_inr: 3000-4000
  preflight_required_for_research_and_reports: true
  public_canary_requires_explicit_approval: true
  quote_exchange_rate_inr_per_usd: 87
  per_agent_quotas: true
  concurrency_limits: true
  batch_public_work: true
  cache_public_deterministic_outputs: true

failure_and_degradation:
  provider_timeout: retry_once_then_fallback
  rate_limit: exponential_backoff_then_local_or_queue
  malformed_output: schema_repair_once_then_fallback
  budget_soft_cap: block_heavy_routes_and_reduce_concurrency
  budget_hard_cap: cloud_hard_stop_local_only
  secret_missing: mark_blocked_secret_never_log_secret_value
  model_unavailable: resolve_alias_fallback_without_agent_change
  all_models_unavailable: deterministic_tools_and_human_queue
  client_or_restricted_data: local_only_no_cloud_fallback

governance:
  secret_storage: environment_or_keychain_reference_only
  secret_logging: prohibited
  provider_slug_location: central_alias_registry_only
  benchmark_before_promotion: true
  benchmark_suites: [routing_accuracy, extraction_quality, tool_use_success, long_context_recall, coding_release_gate, investment_review_calibration]
  canary_required: true
  rollback: alias_repoint_without_agent_edits
  audit_fields: [trace_id, task_type, alias, resolved_provider, resolved_model, decision_reason, attempts, latency_ms, tokens, estimated_cost_inr, actual_cost_inr, approval_id, data_boundary, preflight_id, receipt_id]

safety:
  broker_writes: false
  client_private_cloud: false
  raw_cloud_prompt_storage: false
  autonomous_heavy_models: false
  human_final_investment_authority: Devarsh
  trading_progression: [read_only, research_and_reports, draft, paper, staged_live, human_confirmed]
  low_cost_research_and_drafts_allowed: true
  strong_review_before_execution: true
  explicit_human_confirmation_before_live_execution: true
