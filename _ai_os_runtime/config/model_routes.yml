version: 2
purpose: >
  Jarvis model routing map. Charlie delegates to Jarvis, Jarvis classifies the task,
  retrieves role-scoped evidence, then selects the cheapest promoted model. A model
  being installed is not sufficient: the exact digest and task suite must pass.

providers:
  ollama:
    role: governed_local_runtime
    base_url: http://127.0.0.1:11434
    storage_root: /Volumes/Devarsh SSD/AI OS Data/ollama/models
    notes: "Concurrency one. Client-private data is local-only. Models never own arithmetic, risk, backtests, approvals, or execution."
  codex:
    role: engineering_escalation
    base_url: codex_desktop
    notes: "Use for code changes, debugging, architecture, repo work, and hard verification."
  cloud_optional:
    role: approval_gated_reasoning_escalation
    base_url: configured_later
    notes: "Public or redacted context only after privacy, cost, and human approval."

routes:
  always_on_daily_driver:
    task_class: routing_and_routine_work
    default_provider: local_tools
    default_model: deterministic_router_v1
    fallback_route: deterministic_tools
    escalation_route: local_workhorse_synthesis
    max_cost_tier: local
    context_tokens: 0
    status: production

  local_workhorse_synthesis:
    task_class: investment_research_synthesis
    default_provider: mlx
    default_model: DreamFoundries/Qwen3.5-9B-4bit
    fallback_route: always_on_daily_driver
    escalation_provider: cloud_optional
    max_cost_tier: local_plus
    context_tokens: 16384
    status: rejected_until_mid_v1_passes

  filings_analysis:
    task_class: filing_analysis
    default_provider: local_tools
    default_model: deterministic_filings_pipeline_v1
    fallback_route: deterministic_tools
    escalation_provider: cloud_optional
    max_cost_tier: local_plus
    context_tokens: 0
    status: production_deterministic

  strategy_generation:
    task_class: strategy_research
    default_provider: local_tools
    default_model: governed_strategy_pipeline_v1
    fallback_route: deterministic_tools
    escalation_provider: codex
    max_cost_tier: local_plus
    context_tokens: 0
    status: production_deterministic

  multimodal_document_analysis:
    task_class: multimodal_document_analysis
    default_provider: local_tools
    default_model: deterministic_document_extraction_v1
    fallback_route: deterministic_tools
    escalation_provider: cloud_optional
    max_cost_tier: local_plus
    context_tokens: 0
    status: rejected_until_multimodal_v1_passes

  local_embedding_retrieval:
    task_class: embedding
    default_provider: ollama
    default_model: qwen3-embedding:0.6b
    fallback_model: null
    max_cost_tier: local
    vector_dimensions: 1024
    status: production

  software_engineering:
    task_class: coding
    default_provider: codex
    default_model: current_codex
    max_cost_tier: codex
