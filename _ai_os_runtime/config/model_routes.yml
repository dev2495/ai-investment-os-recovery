version: 7
purpose: >
  Charlie handles natural operator conversation and delegates typed work to Jarvis
  and role-scoped agents. Private context stays on evaluated local models. Public
  and internal work can use capped cloud routes. Deterministic tools own arithmetic,
  research extraction, risk, backtests, approvals, and execution state.

registry_contract:
  declaration_fields: [task_type, risk, tools, context_need, latency, cost_ceiling_inr, data_boundary, approval_required]
  decision_fields: [primary_alias, fallback_alias, escalation_alias, escalation_trigger, maximum_budget_inr, trace_id, decision_reason, usage_event_id]
  rule: >
    Agents declare task requirements and never bind provider model slugs. The
    central alias registry owns provider bindings, retries, fallbacks, budgets,
    and audit fields so a model can be switched without editing each agent.

model_aliases:
  local.private.default:
    route: charlie_munger_orchestration
    data_boundary: client_private_local_only
  research.public.extractor:
    route: openrouter_public_extract_flash
    provider_binding: openrouter
    model_binding: deepseek/deepseek-v4-flash-0731
    secret_ref: AI_OS_OPENROUTER_API_KEY
    data_boundary: public_only
    approval_required: true
    status: canary_only_disabled
  research.public.multimodal:
    route: openrouter_public_multimodal_gemini
    provider_binding: openrouter
    model_binding: google/gemini-3.7-flash
    secret_ref: AI_OS_OPENROUTER_API_KEY
    data_boundary: public_only
    approval_required: true
    status: canary_only_disabled
  research.public.lead.glm52:
    route: openrouter_public_lead_glm52_canary
    provider_binding: openrouter
    model_binding: z-ai/glm-5.2
    secret_ref: AI_OS_OPENROUTER_API_KEY
    data_boundary: public_only
    approval_required: true
    status: canary_only_disabled
  research.public.lead.deepseek_v4_pro:
    route: openrouter_public_lead_deepseek_v4_pro_canary
    provider_binding: openrouter
    model_binding: deepseek/deepseek-v4-pro-0813
    secret_ref: AI_OS_OPENROUTER_API_KEY
    data_boundary: public_only
    approval_required: true
    status: canary_only_disabled
  research.public.lead.qwen38_max:
    route: openrouter_public_lead_qwen38_max_canary
    provider_binding: openrouter
    model_binding: qwen/qwen3.8-max
    secret_ref: AI_OS_OPENROUTER_API_KEY
    data_boundary: public_only
    approval_required: true
    status: pending_no_verified_zdr_endpoint
  cloud.volume.default:
    route: cloud_volume_flash
    provider_binding: openrouter
    model_binding: deepseek/deepseek-v4-flash
    secret_ref: AI_OS_OPENROUTER_API_KEY
    data_boundary: public_or_redacted_internal_only
  cloud.complex.escalation:
    route: cloud_complex_glm
    provider_binding: openrouter
    model_binding: z-ai/glm-5.2
    secret_ref: AI_OS_OPENROUTER_API_KEY
    data_boundary: public_or_approved_redacted_internal_only
  specialist.lead_engineer:
    route: heavy_specialist_lead_engineer
    provider_binding: operator_selected_heavy_llama
    data_boundary: repository_only_no_secrets
  specialist.senior_investment_reviewer:
    route: heavy_specialist_investment_reviewer
    provider_binding: operator_selected_heavy_llama
    data_boundary: public_or_approved_redacted_internal_only
  specialist.final_strategy_writer:
    route: heavy_specialist_final_strategy_writer
    provider_binding: operator_selected_heavy_llama
    data_boundary: public_or_approved_redacted_internal_only

task_routing_registry:
  high_volume_public_work:
    task_types: [extraction, classification, summary, routing, research_triage, document_processing, first_pass_agent_work]
    primary_alias: cloud.volume.default
    fallback_alias: local.private.default
    escalation_alias: cloud.complex.escalation
    escalation_triggers: [two_failed_attempts, low_confidence, tool_plan_over_8_steps, context_over_64000, reviewer_rejects]
    maximum_budget_inr: 35
    concurrency_limit: 3
    batching: true
    caching: deterministic_and_public_only
  complex_public_work:
    task_types: [complex_planning, long_context_tool_use, difficult_coding, long_multi_step_task]
    primary_alias: cloud.complex.escalation
    fallback_alias: cloud.volume.default
    escalation_alias: specialist.lead_engineer
    escalation_triggers: [glm_failure, explicit_specialist_request, release_gate_failure]
    maximum_budget_inr: 120
    concurrency_limit: 1
    approval_required: true
  named_first_class_specialists:
    allowed_agents: [Lead Engineer, Senior Investment Reviewer, Final Strategy Writer]
    aliases: [specialist.lead_engineer, specialist.senior_investment_reviewer, specialist.final_strategy_writer]
    prohibited_uses: [routine_work, committee_duplication, parallel_opinion_generation]
    maximum_budget_inr: 250
    concurrency_limit: 1
    approval_required: true

providers:
  local_openai:
    role: macbook_private_conversation_and_tool_intake
    base_url: http://100.75.156.32:11436/v1
    model: mlx-community/Qwen3.5-9B-4bit
    production_fallback_model: prism-ml/Bonsai-27B-Q1_0
    storage_root: ~/Library/Application Support/AIOS/models
    notes: "Qwen3.5 9B passed conversation_v1 on MLX-VLM 0.6.6 with unquantized KV cache. It failed the broader mid_v1 gate and is restricted to conversation, task intake, and tool selection. Bonsai remains the rollback route. No model has direct arithmetic, capital authority, or broker writes."
  ollama:
    role: imac_embeddings
    base_url: http://127.0.0.1:11434
    storage_root: /Volumes/Devarsh SSD/AI OS Data/ollama/models
    models:
      embedding: qwen3-embedding:0.6b
    notes: "One model at a time on the 8 GB iMac. Client-private retrieval remains local."
  imac_local_openai:
    role: always_on_private_conversation_fallback
    base_url: http://127.0.0.1:11436/v1
    storage_root: /Volumes/Devarsh SSD/AI OS Data/models/nanbeige42-runtime
    model: nanbeige/nanbeige4.2:3b-Q4_K_M
    secondary_candidate: mlx-community/Qwen3.5-2B-4bit
    notes: "Nanbeige is assignable only after exact-digest conversation_v1 promotion. It has no calculation, research-authority, capital, approval, or execution authority."
  openrouter:
    role: capped_public_internal_cloud_gateway
    base_url: https://openrouter.ai/api/v1
    notes: "ZDR, data collection denied, no client data, no raw prompt retention, and hard cost caps."
  openai:
    role: optional_direct_cloud_gateway
    base_url: https://api.openai.com/v1
    notes: "Use after a direct key is configured; store=false and the same privacy/budget controls apply."
  codex:
    role: engineering_escalation
    base_url: codex_desktop
    notes: "Repository implementation, debugging, architecture changes, and release verification."

routes:
  openrouter_public_extract_flash:
    task_class: public_document_extraction_canary
    default_provider: openrouter
    default_model: deepseek/deepseek-v4-flash-0731
    fallback_route: local_workhorse_synthesis
    escalation_route: openrouter_public_multimodal_gemini
    max_cost_tier: cloud_low
    privacy: public_only
    status: disabled_until_explicit_preflight_approval_and_canary_promotion

  openrouter_public_multimodal_gemini:
    task_class: public_document_multimodal_canary
    default_provider: openrouter
    default_model: google/gemini-3.7-flash
    fallback_route: openrouter_public_extract_flash
    escalation_route: openrouter_public_lead_deepseek_v4_pro_canary
    max_cost_tier: cloud_medium
    privacy: public_only
    status: disabled_until_explicit_preflight_approval_and_canary_promotion

  openrouter_public_lead_glm52_canary:
    task_class: public_company_lead_canary
    default_provider: openrouter
    default_model: z-ai/glm-5.2
    fallback_route: openrouter_public_lead_deepseek_v4_pro_canary
    escalation_route: openrouter_public_lead_qwen38_max_canary
    max_cost_tier: cloud_medium
    privacy: public_only
    status: disabled_until_explicit_preflight_approval_and_canary_promotion

  openrouter_public_lead_deepseek_v4_pro_canary:
    task_class: public_company_lead_canary
    default_provider: openrouter
    default_model: deepseek/deepseek-v4-pro-0813
    fallback_route: openrouter_public_lead_glm52_canary
    escalation_route: openrouter_public_lead_qwen38_max_canary
    max_cost_tier: cloud_medium
    privacy: public_only
